model: yolov8n.pt
epochs: 100
batch: 16
imgsz: 640
device: auto
optimizer: AdamW
lr0: 0.01
lrf: 0.01
patience: 20
augment:
  mosaic: 1.0
  mixup: 0.1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  flipud: 0.0
  fliplr: 0.5
  scale: 0.5
  translate: 0.1
  perspective: 0.0001
classes:
  0: person
  1: helmet
  2: no-helmet
  3: safety-vest
  4: no-vest
