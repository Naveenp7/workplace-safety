version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../data/uploads:/app/data/uploads
      - ../ml/models:/app/ml/models
      - ../data/db:/app/data/db
    env_file:
      - ../.env
    networks:
      - safety-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - safety-net

networks:
  safety-net:
    driver: bridge
